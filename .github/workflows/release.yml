name: Release

# Builds Taurie V2 desktop binaries and publishes them to a GitHub Release.
# Triggered automatically when a version tag (v*) is pushed, or manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: taurie-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: taurie-${{ runner.os }}-

      - name: Build with Tauri
        run: |
          set -o pipefail
          npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee /tmp/tauri-build.log

      - name: Push build log to diagnostics branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/tauri-build.log tauri-build-diagnostics.txt
          git config user.email "ci@optimakerpro.dev"
          git config user.name "Taurie CI"
          git add tauri-build-diagnostics.txt
          git commit -q -m "ci: capture tauri build diagnostics (${{ matrix.platform }})"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/ci-build-diagnostics || true

      - name: Attach build error to release
        if: failure() && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Build diagnostics (${{ matrix.platform }})'
            echo '```'
            tail -60 /tmp/tauri-build.log
            echo '```'
          } > /tmp/build-error.md
          BODY=$(python3 -c "import json; print(json.dumps({'body': open('/tmp/build-error.md').read()}))")
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            -d "$BODY"

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurie-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
